; Defaults tuned for Nextcloud. Override by mounting another file into
; $PHP_INI_DIR/conf.d/ that sorts after this one.

expose_php = Off
memory_limit = 1G
upload_max_filesize = 16G
post_max_size = 16G
max_input_time = 3600
max_execution_time = 3600
output_buffering = Off

; OPcache (https://docs.nextcloud.com/server/latest/admin_manual/installation/server_tuning.html)
opcache.enable = 1
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 256
opcache.save_comments = 1
opcache.revalidate_freq = 60

; APCu local cache, also needed for occ/cron on the CLI
apc.enable_cli = 1
apc.shm_size = 128M
